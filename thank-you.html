    <!-- Primary SEO Meta Tags -->

    <!-- Favicon & App Icons -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/tailwind.output.css">

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<body class="bg-[#0B0F19] text-[#F5F7FA] font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-[#5865F2]/30 selection:text-white">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-30 w-full border-b border-[#2A3147] bg-[#0B0F19]/90 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group py-1" aria-label="TechPath Home">
                <img src="assets/branding/techpath-logo-horizontal.png" alt="TechPath" class="h-8 md:h-9 w-auto object-contain hidden sm:block transition-transform duration-200 group-hover:scale-[1.02]" />
                <img src="assets/branding/techpath-emblem.png" alt="TechPath" class="h-7 w-auto object-contain sm:hidden" />
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs font-semibold text-[#A1A7BC] hover:text-[#F5F7FA] px-3 py-2 rounded-lg transition-colors">
                    Home
                </a>
                <a href="dashboard.html" class="text-xs font-semibold px-4 py-2 rounded-xl bg-[#1A2031] hover:bg-[#21293D] border border-[#2A3147] text-[#F5F7FA] transition-all">
                    Dashboard
                </a>
            </div>
        </div>
    </header>

    <!-- Main Confirmation Body -->
    <main class="flex-1 z-10 flex items-center justify-center p-6 sm:p-12 w-full">
        <div class="w-full max-w-xl bg-[#121826]/95 border border-[#2A3147] rounded-3xl p-8 sm:p-12 shadow-2xl backdrop-blur-md text-center relative overflow-hidden">
            
            <!-- Ambient Glow -->
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#2DD4BF]/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-[#5865F2]/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Success Icon Badge -->
            <div class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-[#2DD4BF]/15 border border-[#2DD4BF]/30 flex items-center justify-center text-[#2DD4BF] shadow-xl shadow-teal-500/10">
                <span id="confirm-icon" class="material-symbols-outlined text-4xl">check_circle</span>
            </div>

            <!-- Title & Contextual Messaging -->
            <h1 id="confirm-heading" class="text-2xl sm:text-3xl font-extrabold text-[#F5F7FA] tracking-tight mb-3">
                Thank You!
            </h1>

            <p id="confirm-subheading" class="text-base font-semibold text-[#2DD4BF] mb-2">
                Your review has been submitted successfully.
            </p>

            <p id="confirm-message" class="text-sm text-[#A1A7BC] leading-relaxed max-w-md mx-auto mb-8">
                Your feedback helps us improve TechPath for engineering students.
            </p>

            <!-- Action CTAs -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="index.html" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-gradient-to-r from-[#5865F2] to-[#7C5CFF] text-xs sm:text-sm font-bold text-white flex items-center justify-center gap-2 shadow-lg hover:shadow-indigo-500/25 transition-all">
                    <span class="material-symbols-outlined text-base">home</span>
                    <span>Back to Home</span>
                </a>
                <a id="confirm-secondary-cta" href="learn.html" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-[#1A2031] hover:bg-[#21293D] border border-[#2A3147] text-xs sm:text-sm font-semibold text-[#F5F7FA] flex items-center justify-center gap-2 transition-all">
                    <span class="material-symbols-outlined text-base text-[#2DD4BF]">school</span>
                    <span id="confirm-secondary-label">Continue Learning</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="z-10 border-t border-[#2A3147]/60 py-6 text-center text-xs text-[#A1A7BC]">
        <p>&copy; 2026 TechPath. All rights reserved. • Support: <a href="mailto:lakkimsettirahulashokh@gmail.com" class="text-teal-400 hover:underline font-mono">lakkimsettirahulashokh@gmail.com</a></p>
    </footer>

    <!-- Context Resolution Script -->
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const source = params.get('source');

            const heading = document.getElementById('confirm-heading');
            const subheading = document.getElementById('confirm-subheading');
            const message = document.getElementById('confirm-message');
            const secondaryCta = document.getElementById('confirm-secondary-cta');
            const secondaryLabel = document.getElementById('confirm-secondary-label');

            if (source === 'contact') {
                heading.textContent = 'Thank You!';
                subheading.textContent = 'Your message has been received.';
                message.textContent = 'Our support team will review your inquiry and get back to you via email when appropriate.';
                secondaryCta.href = 'learn.html';
                secondaryLabel.textContent = 'Continue Learning';
            } else {
                heading.textContent = 'Thank You!';
                subheading.textContent = 'Your review has been submitted successfully.';
                message.textContent = 'Your feedback helps us improve TechPath for engineering students.';
                secondaryCta.href = 'learn.html';
                secondaryLabel.textContent = 'Continue Learning';
            }
        })();
    </script>
</body>
</html>
