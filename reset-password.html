<body class="bg-[#0B0F19] text-[#F5F7FA] min-h-screen flex flex-col justify-between p-6 relative overflow-x-hidden antialiased selection:bg-[#5865F2] selection:text-white">

    <!-- Ambient Glows -->
    <div class="fixed top-0 left-1/3 w-96 h-96 bg-[#5865F2]/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-[#2DD4BF]/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <header class="w-full max-w-md mx-auto py-6 flex items-center justify-between relative z-20">
        <a href="index.html" class="flex items-center gap-2.5 group py-1" aria-label="TechPath Home">
            <img src="assets/branding/techpath-logo-horizontal.png" alt="TechPath" class="h-8 md:h-9 w-auto object-contain hidden sm:block transition-transform duration-200 group-hover:scale-[1.02]" />
            <img src="assets/branding/techpath-emblem.png" alt="TechPath" class="h-7 w-auto object-contain sm:hidden" />
        </a>
        <a href="login.html" class="text-xs text-[#A1A7BC] hover:text-[#F5F7FA] transition-colors flex items-center gap-1 font-medium">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            <span>Back to Login</span>
        </a>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md mx-auto my-auto relative z-10 py-6">
        <div class="bg-[#121826] border border-[#2A3147] rounded-3xl p-8 space-y-6 shadow-2xl backdrop-blur-md">
            
            <div class="text-center space-y-2 border-b border-[#2A3147]/60 pb-6">
                <div class="w-12 h-12 rounded-2xl bg-[#5865F2]/20 border border-[#5865F2]/40 flex items-center justify-center text-[#5865F2] mx-auto mb-3 shadow-inner">
                    <span class="material-symbols-outlined text-2xl">lock_reset</span>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-[#F5F7FA]">Set New Password</h1>
                <p class="text-xs text-[#A1A7BC] leading-relaxed">
                    Create a new, secure password for your TechPath account.
                </p>
            </div>

            <!-- Feedback Alert -->
            <div id="reset-alert" class="hidden p-3.5 rounded-2xl text-xs flex items-center gap-2.5">
                <span id="reset-alert-icon" class="material-symbols-outlined text-base shrink-0">info</span>
                <span id="reset-alert-msg" class="leading-relaxed"></span>
            </div>

            <!-- Form -->
            <form id="reset-password-form" onsubmit="handleResetPasswordSubmit(event)" class="space-y-5 text-xs">
                
                <!-- New Password Field -->
                <div>
                    <label class="block text-[#A1A7BC] mb-1.5 font-medium">New Password</label>
                    <div class="relative">
                        <input 
                            id="input-new-password" 
                            type="password" 
                            placeholder="Minimum 6 characters" 
                            required 
                            minlength="6"
                            class="premium-input rounded-xl w-full px-4 py-3 text-xs text-[#F5F7FA] pr-10"
                            oninput="checkPasswordStrength(this.value)"
                        />
                        <button type="button" onclick="togglePasswordVisibility('input-new-password', this)" class="absolute right-3 top-3 text-[#A1A7BC] hover:text-white transition-colors" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined text-base">visibility</span>
                        </button>
                    </div>

                    <!-- Strength Indicator -->
                    <div class="mt-2 flex items-center gap-2">
                        <div class="flex-1 h-1.5 bg-[#1A2031] rounded-full overflow-hidden flex gap-1">
                            <div id="strength-bar-1" class="h-full w-1/3 bg-[#2A3147] transition-all duration-300"></div>
                            <div id="strength-bar-2" class="h-full w-1/3 bg-[#2A3147] transition-all duration-300"></div>
                            <div id="strength-bar-3" class="h-full w-1/3 bg-[#2A3147] transition-all duration-300"></div>
                        </div>
                        <span id="strength-label" class="text-[10px] text-[#A1A7BC] font-mono">Password strength</span>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label class="block text-[#A1A7BC] mb-1.5 font-medium">Confirm New Password</label>
                    <div class="relative">
                        <input 
                            id="input-confirm-password" 
                            type="password" 
                            placeholder="Repeat new password" 
                            required 
                            minlength="6"
                            class="premium-input rounded-xl w-full px-4 py-3 text-xs text-[#F5F7FA] pr-10"
                        />
                        <button type="button" onclick="togglePasswordVisibility('input-confirm-password', this)" class="absolute right-3 top-3 text-[#A1A7BC] hover:text-white transition-colors" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined text-base">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="btn-submit-reset" 
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#5865F2] to-[#7C5CFF] hover:opacity-95 text-white font-bold text-xs tracking-wide shadow-xl flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                    <span class="material-symbols-outlined text-sm">security</span>
                    <span id="btn-submit-text">Update Password & Login</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto py-4 text-center text-xs text-[#A1A7BC]/80">
        TechPath • Support: <a href="mailto:lakkimsettirahulashokh@gmail.com" class="text-[#2DD4BF] hover:underline font-mono">lakkimsettirahulashokh@gmail.com</a>
    </footer>

    <!-- Supabase Client & Auth -->
    <script src="js/supabase.min.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                if (icon) icon.textContent = 'visibility';
            }
        }

        function checkPasswordStrength(val) {
            const bar1 = document.getElementById('strength-bar-1');
            const bar2 = document.getElementById('strength-bar-2');
            const bar3 = document.getElementById('strength-bar-3');
            const label = document.getElementById('strength-label');
            if (!val || val.length < 6) {
                bar1.style.backgroundColor = '#2A3147';
                bar2.style.backgroundColor = '#2A3147';
                bar3.style.backgroundColor = '#2A3147';
                label.textContent = 'Too short';
                label.className = 'text-[10px] text-red-400 font-mono';
                return;
            }

            let score = 1;
            if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) score = 2;
            if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score = 3;

            if (score === 1) {
                bar1.style.backgroundColor = '#F59E0B';
                bar2.style.backgroundColor = '#2A3147';
                bar3.style.backgroundColor = '#2A3147';
                label.textContent = 'Fair';
                label.className = 'text-[10px] text-amber-400 font-mono';
            } else if (score === 2) {
                bar1.style.backgroundColor = '#2DD4BF';
                bar2.style.backgroundColor = '#2DD4BF';
                bar3.style.backgroundColor = '#2A3147';
                label.textContent = 'Good';
                label.className = 'text-[10px] text-teal-300 font-mono';
            } else {
                bar1.style.backgroundColor = '#22C55E';
                bar2.style.backgroundColor = '#22C55E';
                bar3.style.backgroundColor = '#22C55E';
                label.textContent = 'Strong';
                label.className = 'text-[10px] text-emerald-400 font-mono';
            }
        }

        function showAlert(msg, isError = true) {
            const alert = document.getElementById('reset-alert');
            const alertIcon = document.getElementById('reset-alert-icon');
            const alertMsg = document.getElementById('reset-alert-msg');
            if (!alert) return;

            alert.classList.remove('hidden', 'bg-red-500/15', 'text-red-300', 'border-red-500/30', 'bg-emerald-500/15', 'text-emerald-300', 'border-emerald-500/30');
            if (isError) {
                alert.classList.add('bg-red-500/15', 'text-red-300', 'border', 'border-red-500/30');
                alertIcon.textContent = 'error';
            } else {
                alert.classList.add('bg-emerald-500/15', 'text-emerald-300', 'border', 'border-emerald-500/30');
                alertIcon.textContent = 'check_circle';
            }
            alertMsg.textContent = msg;
        }

        async function handleResetPasswordSubmit(event) {
            event.preventDefault();
            const p1 = document.getElementById('input-new-password').value;
            const p2 = document.getElementById('input-confirm-password').value;
            const btn = document.getElementById('btn-submit-reset');
            const btnText = document.getElementById('btn-submit-text');

            if (p1 !== p2) {
                showAlert('Passwords do not match. Please re-enter.');
                return;
            }
            if (p1.length < 6) {
                showAlert('Password must be at least 6 characters long.');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Updating Password...';

            try {
                const client = SupabaseBridge.getClient();
                if (!client) throw new Error('Supabase client unavailable.');

                const { data, error } = await client.auth.updateUser({ password: p1 });
                if (error) throw error;

                showAlert('Password successfully updated! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = 'login.html?updated=true';
                }, 1500);
            } catch (err) {
                console.error('[ResetPassword] Error:', err);
                showAlert(err.message || 'Failed to update password. Please request a new reset link.');
                btn.disabled = false;
                btnText.textContent = 'Update Password & Login';
            }
        }
    </script>
</body>
</html>
