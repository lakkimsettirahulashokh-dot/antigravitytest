<body class="page-404" data-bg-preset="minimal">

    <!-- Minimal Clean Header: TechPath Logo Only -->

    </header>

    <!-- Main Content Stage: 3D Scene + Minimal Composition -->
    <main class="content-wrapper-404">
        
        <!-- 3D PERSPECTIVE 404 STAGE -->
        <div class="scene-3d-stage" aria-hidden="true">
            <div id="scene-3d-rig" class="scene-3d-rig">
                
                <!-- Floor Ambient Shadow -->
                <div class="stage-shadow-plane"></div>

                <!-- Floating Data Sparks (Micro-particles catching light) -->
                <div class="data-particle p1"></div>
                <div class="data-particle p2"></div>
                <div class="data-particle p3"></div>
                <div class="data-particle p4"></div>

                <!-- 1. DIMENSIONAL 404 NUMBERS -->
                <div class="numbers-layer">
                    
                    <!-- Left '4' (Slightly angled in 3D perspective) -->
                    <div class="glyph-404 left-four">
                        <span>4</span>
                    </div>

                    <!-- Center '0' (Forward in depth, anchor for robot) -->
                    <div class="glyph-404 center-zero">
                        <span>0</span>

                        <!-- 2. COMPANION ROBOT SITTING ON THE '0' LEDGE -->
                        <div class="robot-companion-wrap">
                            <svg class="robot-svg" viewBox="0 0 130 150">
                                <defs>
                                    <!-- Metallic Gradient for Robot Shell -->
                                    <linearGradient id="botShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#334155"/>
                                        <stop offset="50%" stop-color="#1E293B"/>
                                        <stop offset="100%" stop-color="#0F172A"/>
                                    </linearGradient>

                                    <!-- Visor Screen Dark Glass -->
                                    <linearGradient id="botVisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="#0A0E17"/>
                                        <stop offset="100%" stop-color="#020408"/>
                                    </linearGradient>

                                    <!-- Glowing OLED Sensor Filter -->
                                    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
                                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                                        <feMerge>
                                            <feMergeNode in="blur"/>
                                            <feMergeNode in="SourceGraphic"/>
                                        </feMerge>
                                    </filter>
                                </defs>

                                <!-- Holographic Question Mark Hovering -->
                                <g class="holo-question">
                                    <text x="86" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#2DD4BF" filter="url(#cyanGlow)">?</text>
                                </g>

                                <!-- Dangling Magnetic Boots (Inside '0' hollow) -->
                                <g class="robot-boots-group">
                                    <!-- Left Leg & Boot -->
                                    <path d="M52 104 L48 126 C48 131 41 131 41 126 L45 104 Z" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                                    <ellipse cx="44" cy="128" rx="7" ry="3.5" fill="#38BDF8" filter="url(#cyanGlow)"/>
                                    
                                    <!-- Right Leg & Boot -->
                                    <path d="M78 104 L82 126 C82 131 89 131 89 126 L85 104 Z" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                                    <ellipse cx="86" cy="128" rx="7" ry="3.5" fill="#38BDF8" filter="url(#cyanGlow)"/>
                                </g>

                                <!-- Torso Resting on Top Curve of '0' -->
                                <path d="M46 95 C46 86 84 86 84 95 L88 108 C88 114 42 114 42 108 Z" fill="url(#botShellGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
                                <!-- Torso Power Indicator -->
                                <circle cx="65" cy="102" r="3" fill="#2DD4BF" filter="url(#cyanGlow)"/>

                                <!-- Hands Resting on Curve / Holding Nav Probe -->
                                <circle cx="39" cy="98" r="5" fill="#334155" stroke="rgba(255,255,255,0.15)"/>
                                <circle cx="91" cy="98" r="5" fill="#334155" stroke="rgba(255,255,255,0.15)"/>
                                <!-- Mini Navigation Probe Antenna Wire -->
                                <path d="M91 96 L99 88" stroke="#5865F2" stroke-width="1.5" stroke-linecap="round"/>
                                <circle cx="99" cy="88" r="2.5" fill="#5865F2" filter="url(#cyanGlow)"/>

                                <!-- Robot Head Assembly (Tilts with cursor) -->
                                <g id="robot-head-group" class="robot-head-group">
                                    <!-- Antenna with Sensor Light -->
                                    <path d="M65 34 L65 18" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
                                    <circle cx="65" cy="16" r="4" fill="#38BDF8" filter="url(#cyanGlow)"/>

                                    <!-- Magnetic Ear Sensors -->
                                    <rect x="25" y="48" width="6" height="22" rx="3" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
                                    <rect x="99" y="48" width="6" height="22" rx="3" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>

                                    <!-- Head Outer Shell -->
                                    <rect x="30" y="32" width="70" height="58" rx="24" fill="url(#botShellGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.4"/>
                                    <!-- Specular Glare Arc on Head -->
                                    <path d="M42 38 C52 34 78 34 88 38" stroke="rgba(255,255,255,0.22)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

                                    <!-- Visor Screen -->
                                    <rect x="37" y="42" width="56" height="38" rx="15" fill="url(#botVisorGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                                    <!-- Visor Reflection Sheen -->
                                    <path d="M42 48 C50 44 76 44 86 48" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" fill="none"/>

                                    <!-- Left Eye -->
                                    <g transform="translate(52, 60)">
                                        <ellipse cx="0" cy="0" rx="8" ry="8.5" fill="#020408"/>
                                        <g id="robot-pupil-left" class="robot-pupil">
                                            <ellipse id="eye-left-shape" cx="0" cy="0" rx="5.5" ry="8" fill="#38BDF8" filter="url(#cyanGlow)"/>
                                            <circle cx="1.5" cy="-2.5" r="1.5" fill="#FFFFFF"/>
                                        </g>
                                    </g>

                                    <!-- Right Eye -->
                                    <g transform="translate(78, 60)">
                                        <ellipse cx="0" cy="0" rx="8" ry="8.5" fill="#020408"/>
                                        <g id="robot-pupil-right" class="robot-pupil">
                                            <ellipse id="eye-right-shape" cx="0" cy="0" rx="5.5" ry="8" fill="#38BDF8" filter="url(#cyanGlow)"/>
                                            <circle cx="1.5" cy="-2.5" r="1.5" fill="#FFFFFF"/>
                                        </g>
                                    </g>
                                </g>
                            </svg>
                        </div>
                    </div>

                    <!-- Right '4' (Slightly angled opposite) -->
                    <div class="glyph-404 right-four">
                        <span>4</span>
                    </div>

                </div>

                <!-- 3. INTERRUPTED LEARNING PATH CONDUIT (Winding through numbers and breaking off) -->
                <svg class="interrupted-conduit-svg" viewBox="0 0 520 270">
                    <defs>
                        <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#5865F2" stop-opacity="0.3"/>
                            <stop offset="35%" stop-color="#5865F2" stop-opacity="0.85"/>
                            <stop offset="70%" stop-color="#2DD4BF" stop-opacity="0.95"/>
                            <stop offset="100%" stop-color="#2DD4BF" stop-opacity="1"/>
                        </linearGradient>
                    </defs>

                    <!-- Active Learning Conduit curving through the 3D space -->
                    <path class="conduit-path-active" d="M 60 210 C 130 190, 150 140, 205 160 C 255 180, 275 80, 315 110 C 340 130, 375 120, 395 70" />
                    
                    <!-- Conduit Break Point / Snapped Wire Sparks -->
                    <g transform="translate(395, 70)">
                        <circle cx="0" cy="0" r="3" fill="#2DD4BF" />
                        <line x1="0" y1="0" x2="8" y2="-6" stroke="#2DD4BF" stroke-width="1.8" class="conduit-break-spark" />
                        <line x1="0" y1="0" x2="6" y2="7" stroke="#7C5CFF" stroke-width="1.8" class="conduit-break-spark" />
                        <circle cx="12" cy="-9" r="1.5" fill="#FFFFFF" class="conduit-break-spark" />
                        <circle cx="9" cy="11" r="1.5" fill="#2DD4BF" class="conduit-break-spark" />
                    </g>
                </svg>

            </div>
        </div>
