<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="refresh" content="0; url=/auth-callback.html"/>
    <title>Redirecting to Auth Callback</title>
</head>
<body>
    <script>
        // Forward query and hash parameters to /auth-callback.html
        window.location.replace('/auth-callback.html' + window.location.search + window.location.hash);
    </script>
</body>
</html>
